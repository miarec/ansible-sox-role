---
- name: Install dependencies
  package:
    name: "{{ item }}"
    state: present
    update_cache: true
  with_items: "{{ sox_package_dependencies }}"

# Enable CRB repo for EL8+ - required for libmad
- name: Enable CRB repository | Rocky Linux
  ini_file:
    dest: /etc/yum.repos.d/rocky.repo
    section: crb
    option: enabled
    value: "1"
    mode: "0644"
  when:
    - ansible_facts['distribution'] == "Rocky"
    - ansible_facts['distribution_major_version'] | int >= 8

- name: Enable CRB repository | AlmaLinux
  ini_file:
    dest: /etc/yum.repos.d/almalinux-crb.repo
    section: crb
    option: enabled
    value: "1"
    mode: "0644"
  when:
    - ansible_facts['distribution'] == "AlmaLinux"
    - ansible_facts['distribution_major_version'] | int >= 8

# For RHEL UBI images that have Rocky repos configured, skip RHEL CRB
- name: Check if Rocky CRB repo exists | RHEL
  stat:
    path: /etc/yum.repos.d/rocky-crb.repo
  register: rocky_crb_repo
  when:
    - ansible_facts['distribution'] == "RedHat"
    - ansible_facts['distribution_major_version'] | int >= 8

- name: Enable CRB repository | RHEL
  ini_file:
    dest: /etc/yum.repos.d/redhat.repo
    section: codeready-builder-for-rhel-{{ ansible_facts['distribution_major_version'] }}-{{ ansible_facts['architecture'] }}-rpms
    option: enabled
    value: "1"
    mode: "0644"
  when:
    - ansible_facts['distribution'] == "RedHat"
    - ansible_facts['distribution_major_version'] | int >= 8
    - not (rocky_crb_repo.stat.exists | default(false))

- name: Install EPEL | RedHat
  when:
    - ansible_facts['distribution'] == "RedHat"
  block:
    - name: Import EPEL GPG key | RedHat
      rpm_key:
        key: "https://download.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"
        state: present

    - name: Install EPEL | RedHat
      package:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present

# Install Sox from package
- name: Install base sox package.
  package:
    name: "{{ item }}"
    state: present
    update_cache: true
  with_items: "{{ sox_package_base }}"

# Install additional pacakges for optional audio formats.
- name: Install packages for additional audio formats.
  package:
    name: "{{ item.value.packages }}"
    state: present
  with_dict: "{{ sox_package_optional_formats_config }}"
  loop_control:
    label: "{{ item.key }} - {{ item.value.packages }}"
